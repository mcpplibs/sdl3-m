name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcpp:
    name: mcpp (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,   toolchain: 'gcc@16.1.0' }
          - { os: ubuntu-24.04,   toolchain: 'llvm@23.1.3' }
          - { os: macos-15,       toolchain: 'llvm@23.1.3' }
          - { os: windows-2025,   toolchain: 'llvm@23.1.3' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      XLINGS_NON_INTERACTIVE: 1
      # SDL's headless drivers, as upstream's CTest runs: the tests open windows
      # and audio devices. (The GPU test picks its own: offscreen, or cocoa on macOS.)
      SDL_VIDEO_DRIVER: dummy
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mwrap identity and bilingual README contract
        run: python3 tools/check_mwrap_release.py

      - name: Install Xlings (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/refs/heads/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install Xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install project tools (.xlings.json)
        run: |
          for attempt in 1 2 3; do
            xlings update > /dev/null 2>&1 || true
            if xlings install; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          mcpp --version

      - name: Select the toolchain
        run: |
          name="${{ matrix.toolchain }}"
          mcpp toolchain install "${name%@*}" "${name#*@}"
          mcpp toolchain default "$name"

      - name: A GPU for the SDL_GPU test (lavapipe on Linux and Windows, Metal on macOS; required, not skipped)
        run: tools/ci/gpu.sh

      - name: Build the modules
        run: mcpp build

      - name: Tests (the API, macros, header mixing, SDL_main.h, the app callbacks, a GPU device)
        run: mcpp test

      - name: Export audit (this target's preprocessing of every wrapped header; the generated sources are fresh)
        run: python3 tools/check_exports.py

      - name: SDL's testautomation (26 suites) compiled against the module, with and without SIMD
        run: python3 tools/run_conformance.py
